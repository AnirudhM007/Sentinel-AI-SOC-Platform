version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8008:8008"
    environment:
      - HOST=0.0.0.0
      - PORT=8008
      - MOCK_MODE=True
      - LLM_PROVIDER=mock
    volumes:
      - backend_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
