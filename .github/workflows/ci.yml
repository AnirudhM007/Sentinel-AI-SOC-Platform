name: SENTINEL AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r sentinel-ai/backend/requirements.txt

    - name: Run Pytest Test Suite
      run: |
        cd sentinel-ai/backend
        python -m pytest tests -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: sentinel-ai/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd sentinel-ai/frontend
        npm ci

    - name: Build Frontend (Vite + TypeScript)
      run: |
        cd sentinel-ai/frontend
        npm run build
